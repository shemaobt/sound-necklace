name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required checks (CLAUDE.md "Quality gates"): golden-harness, typecheck, lint,
# depcruise, test. Nomes de job = nomes dos required status checks — não renomear.
#
# ENG-515: três jobs precisam do Chromium (golden-harness → `golden:verify`, que
# regenera da referência; test → `test:browser`; e2e → as specs). O download travava
# até o job estourar o teto e ser CANCELADO, e cancelamento se lê como `fail` no
# `gh pr checks` — um golden vermelho que não significava nada. Por isso, nos três e
# na mesma forma: cache do navegador (chave = versão instalada do Playwright), para
# que em acerto não haja download nenhum; e `timeout-minutes` PRÓPRIO no passo, bem
# abaixo do teto do job, para que um download que caia falhe rápido e dizendo o quê.
# Sem nada de `continue-on-error`: sem navegador, o job TEM de ficar vermelho.
jobs:
  golden-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # runner: replay via domain/contracts vs goldens comitados (byte a byte)
      - run: pnpm golden
      # verify: regenera da referência intocada e prova goldens ≡ referência
      - name: Resolve Playwright version
        id: playwright-version
        # a versão vem do que está INSTALADO: chave chumbada envelhece calada e
        # passaria a servir um navegador de outra versão
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      # as libs de sistema NÃO entram no cache ("operating system dependencies need to
      # be installed, which are not cacheable" — docs do Playwright), então sempre rodam
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium
      - run: pnpm golden:verify

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm depcruise

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Resolve Playwright version
        id: playwright-version
        # a versão vem do que está INSTALADO: chave chumbada envelhece calada e
        # passaria a servir um navegador de outra versão
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      # as libs de sistema NÃO entram no cache ("operating system dependencies need to
      # be installed, which are not cacheable" — docs do Playwright), então sempre rodam
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:browser

  # Job ADICIONAL (não-required): a imagem de produção realmente constrói. Só build,
  # sem push e sem GCP. Existe porque o deploy dispara no push para `main` — ou seja,
  # o merge É o primeiro deploy: sem este job, um Dockerfile ou um lockfile quebrado
  # só apareceria depois de mergeado. Os required checks seguem os de CLAUDE.md.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t sound-necklace:ci .
      # a imagem serve o SPA e falha rápido sem BACKEND_URL — as duas pontas do
      # entrypoint, verificadas sem precisar de rede nem de segredo
      - name: Container serves the SPA
        run: |
          docker run -d --name ci-check -p 8080:8080 -e BACKEND_URL=http://127.0.0.1:1 sound-necklace:ci
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8080/ || { docker logs ci-check; exit 1; }
          curl -sf -o /dev/null http://localhost:8080/dashboard/rota-client-side
          docker rm -f ci-check
      - name: Container refuses to start without BACKEND_URL
        run: |
          if docker run --rm sound-necklace:ci; then echo "::error::deveria ter falhado sem BACKEND_URL"; exit 1; fi

  # Job ADICIONAL (não-required): a aceitação E2E dirige o app real em fixture.
  # Os required checks seguem os de CLAUDE.md — este não entra na lista.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        # a versão vem do que está INSTALADO: chave chumbada envelhece calada e
        # passaria a servir um navegador de outra versão
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      # as libs de sistema NÃO entram no cache ("operating system dependencies need to
      # be installed, which are not cacheable" — docs do Playwright), então sempre rodam
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium
      # o webServer da config sobe o Vite; a spec dirige o Chromium headless
      # o webServer da config sobe o Vite; a spec dirige o Chromium headless
      - run: pnpm e2e
      # Um e2e que estoura o timeout do JOB é cancelado, e o cancelamento engole a
      # saída do Playwright — foi preciso reproduzir às cegas para achar um clique
      # interceptado. Com o contexto publicado, a próxima vez começa pelo motivo.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
