pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # proxy_pass com variável ($request_uri) resolve DNS em runtime — sem resolver,
    # nginx recusa a config. O DNS embutido do Docker (127.0.0.11) fica DE FORA:
    # não existe no Cloud Run e cada requisição rendia um "connection refused" no log
    # antes de cair no próximo servidor.
    resolver 8.8.8.8 8.8.4.4 ipv6=off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    # As respostas de voz sobem em WebM/Opus PELO /api (PUT /sessions/{id}/resources
    # em adapters/sessions/http.ts), não por URL assinada — o corpo passa por aqui.
    # O download é que vai direto ao GCS por URL assinada.
    client_max_body_size 64m;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Sem cabeçalhos CORS: depois do proxy a chamada é same-origin, e o SPA nunca
        # usa base absoluta (ui/app/api-config.ts cai em `/api`).
        location /api {
            proxy_pass ${BACKEND_URL}$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_ssl_name $proxy_host;
            proxy_ssl_server_name on;

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        # Fallback do roteamento client-side. index.html nunca é cacheado: é o que
        # aponta para os assets com hash, então um deploy precisa valer na hora.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Assets com hash no nome: podem ser imutáveis. Um add_header só — `expires`
        # emitiria um SEGUNDO Cache-Control, e dois valores no mesmo response deixam
        # o cache livre para escolher.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
