pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # proxy_pass com variável ($request_uri) resolve DNS em runtime — sem resolver,
    # nginx recusa a config. O DNS embutido do Docker (127.0.0.11) fica DE FORA:
    # não existe no Cloud Run e cada requisição rendia um "connection refused" no log
    # antes de cair no próximo servidor.
    resolver 8.8.8.8 8.8.4.4 ipv6=off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # `gzip on` sozinho só comprime text/html — é o default do nginx e não se estende
    # implicitamente. Sem a lista abaixo o bundle sai cru: ~730 kB de JS que viram
    # ~236 kB comprimidos, mais Lottie e CSS. O Cloud Run não comprime por conta.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # As respostas de voz sobem em WebM/Opus PELO /api (PUT em
    # /api/sound-necklace/sessions/{id}/resources, adapters/sessions/http.ts), não por
    # URL assinada — o corpo passa por aqui, e no default de 1m nginx devolveria 413.
    # O download é que vai direto ao GCS por URL assinada.
    # 16m e não mais: o Cloud Run já corta a requisição em 32 MiB, e nginx bufferiza o
    # corpo em /var/cache/nginx, que ali é RAM contra --memory=256Mi.
    client_max_body_size 16m;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Sem cabeçalhos CORS: depois do proxy a chamada é same-origin, e o SPA nunca
        # usa base absoluta (ui/app/api-config.ts cai em `/api`).
        #
        # `^~` e não um prefixo simples: location de regex ganha de location de prefixo,
        # então sem isto qualquer rota da API terminada nas extensões lá embaixo seria
        # servida do disco e 404aria em vez de ir ao backend.
        location ^~ /api {
            proxy_pass ${BACKEND_URL}$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_ssl_name $proxy_host;
            proxy_ssl_server_name on;

            # 60s para bater com o --timeout=60 do `gcloud run deploy`: o Cloud Run
            # corta a requisição primeiro, então um valor maior aqui seria só promessa.
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        # Fallback do roteamento client-side. index.html nunca é cacheado: é o que
        # aponta para os assets com hash, então um deploy precisa valer na hora.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        # Assets com hash no nome: podem ser imutáveis. Um add_header só — `expires`
        # emitiria um SEGUNDO Cache-Control, e dois valores no mesmo response deixam
        # o cache livre para escolher.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
        }
    }
}
