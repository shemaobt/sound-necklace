# Incluído POR location no nginx.conf, não uma vez no server: o nginx descarta os
# add_header herdados em qualquer escopo que defina os seus próprios, e as duas
# locations de estático definem Cache-Control. Mesmo motivo do oral-collector
# (docker/security-headers.conf), que é o único repo daqui que já tinha isto.
#
# A CSP foi derivada do que o app REALMENTE busca, conferido no bundle construído:
# - script/font: só same-origin (as fontes Merriweather são empacotadas como asset)
# - o hash sha256 no script-src libera UM inline: o boot do tema no index.html (ENG-391),
#   que tem de rodar antes da primeira pintura. 'unsafe-inline' liberaria todos; o hash
#   libera exatamente aquele conteúdo. Mudou o script, mudou o hash — e o tema morreria
#   só em produção, então ui/app/theme-boot.test.ts recalcula e falha antes disso.
# - style: 'unsafe-inline' porque o React escreve estilo inline nos elementos
# - img: data: e blob: para o SVG do guia (DiceBear, gerado em memória)
# - connect: 'self' cobre a API, que é same-origin depois do proxy; storage.googleapis.com
#   é o áudio da história, baixado por URL assinada direto do GCS
# - media: blob: para o áudio decodificado e para a voz da entrevista
# Sem 'wasm-unsafe-eval' e sem worker-src externo: não há WebAssembly, Worker nem eval.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-BmdkFAIXD9lfRyzXHv4iAYv53J4hCR3aFResazqeX9M='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://storage.googleapis.com; media-src 'self' https://storage.googleapis.com blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Só vale sobre HTTPS, terminado na borda do Cloud Run; este nginx fala :8080 em texto.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
